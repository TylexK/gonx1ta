<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Redirigir a CANAL Kenny</title>
  <style>
    body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Segoe UI Emoji,Arial;background:#0b0b0b;color:#fff;display:flex;align-items:center;justify-content:center;height:100vh;margin:0}
    .card{max-width:520px;padding:20px;border-radius:12px;background:#0f1720;text-align:center}
    a.btn{display:inline-block;margin-top:12px;padding:10px 18px;border-radius:8px;background:#25D366;color:#032; text-decoration:none;font-weight:600}
  </style>
</head>
<body>
  <div class="card">
    <h2>CANAL KENNY</h2>
    <p id="msg">Redirigiendo al canal...</p>
    <div id="buttons" style="display:none">
      <a id="open-app" class="btn" href="#">Abrir en WhatsApp</a>
      <a id="open-web" class="btn" href="#">Abrir en web</a>
    </div>
  </div>

  <script>
    const channelId = '0029Vb81f5S6LwHe4NBWl73Z';
    const webUrl = `https://whatsapp.com/channel/${channelId}`;
    const appUrl = `whatsapp://channel/${channelId}`;
    const intentUrl = `intent://${webUrl.replace(/^https?:\/\//,'')}#Intent;package=com.whatsapp;scheme=https;end`;

    const ua = navigator.userAgent || '';
    const isAndroid = /Android/i.test(ua);
    const isIOS = /iPhone|iPad|iPod/i.test(ua);

    document.getElementById('open-web').href = webUrl;
    document.getElementById('open-app').href = appUrl;

    function fallbackToWeb() {
      document.getElementById('msg').textContent = 'Abriendo en el navegador...';
      setTimeout(()=>{ window.location = webUrl; }, 800);
    }

    if (isAndroid) {
      document.getElementById('msg').textContent = 'Android detectado: intentando abrir la app...';
      setTimeout(()=>{ window.location = intentUrl; }, 100);
      setTimeout(()=>{ window.location = webUrl; }, 1600);
    } else if (isIOS) {
      document.getElementById('msg').textContent = 'iOS detectado: abriendo enlace universal...';
      setTimeout(()=>{ window.location = webUrl; }, 200);
      setTimeout(()=>{ document.getElementById('buttons').style.display = 'block'; document.getElementById('msg').textContent = 'Si no se abre, usa los botones:'; }, 1500);
    } else {
      document.getElementById('msg').textContent = 'Abriendo en web...';
      setTimeout(()=>{ window.location = webUrl; }, 200);
    }
  </script>
</body>
</html>
